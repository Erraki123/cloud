<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo List – TP Cloud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #ff6d00;
      margin-bottom: 8px;
    }
    p.subtitle {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }
    input[type="text"]:focus { border-color: #ff6d00; }
    button {
      background: #ff6d00;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #e65100; }
    ul { list-style: none; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 15px;
      border-left: 4px solid #ff6d00;
    }
    li .delete-btn {
      background: transparent;
      color: #e53935;
      font-size: 18px;
      padding: 0 6px;
      border-radius: 4px;
    }
    li .delete-btn:hover { background: #fdecea; }
    #status {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 16px;
    }
    .live-badge {
      display: inline-block;
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔥 Todo List <span class="live-badge">● LIVE</span></h1>
    <p class="subtitle">TP Cloud Computing – Firebase + Vercel</p>

    <div class="form-row">
      <input type="text" id="taskInput" placeholder="Ajouter une tâche..." />
      <button onclick="addTask()">Ajouter</button>
    </div>

    <ul id="taskList"></ul>
    <p id="status">Connexion à Firebase...</p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
